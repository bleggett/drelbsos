name: Build DrelbsOS container image
on:
  schedule:
    - cron: '05 10 * * 3'  # 10:05am UTC wed
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    paths-ignore:
      - "**.md"
  merge_group:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (selects files under profiles/<profile>/)'
        type: string
        default: 'nvidia'
env:
  IMAGE_DESC: "DrelbsOS"
  IMAGE_KEYWORDS: "bootc,fedora"
  IMAGE_LOGO_URL: ""
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  FEDORA_MAJOR_VERSION: "44"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  push-ghcr:
    name: Build and push image
    runs-on: ubuntu-26.04
    continue-on-error: false
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      image_repo: ${{ steps.profile.outputs.image_repo }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Define env.SHA_HEAD_SHORT
        id: shortsha
        run: |
          echo "SHA_HEAD_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Resolve build profile
        id: profile
        run: |
          # Empty for non-dispatch triggers (push/schedule/PR); fall back to default.
          PROFILE="${{ github.event.inputs.profile }}"
          PROFILE="${PROFILE:-nvidia}"
          # Each profile is published to its own OCI repo, IMAGE_NAME-profile.
          IMAGE_REPO="${{ env.IMAGE_NAME }}-${PROFILE}"
          echo "profile=${PROFILE}" >> $GITHUB_OUTPUT
          echo "image_repo=${IMAGE_REPO}" >> $GITHUB_OUTPUT
          echo "Building profile ${PROFILE} -> ${{ env.IMAGE_REGISTRY }}/${IMAGE_REPO}"

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "date=$TIMESTAMP" >> $GITHUB_OUTPUT
          # However, OCI *tags* do not like this format,so munge for that usage.
          echo "date_tag=${TIMESTAMP//:/-}" >> $GITHUB_OUTPUT

      # Checkout push-to-registry action GitHub repository
      - name: Checkout Push to Registry action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Generate a primary version key
      - name: Generate Version
        id: generate-version
        shell: bash
        run: |
          # Generate the primary version key that will be stored on os-release,
          # shown on the bootloader, and used for the image tag.
          VERSION="${FEDORA_MAJOR_VERSION}.${{ steps.date.outputs.date_tag }}"

          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

          echo "Generated the following:"
          cat $GITHUB_OUTPUT

      - name: Toolchain versions
        run: |
          buildah version
          podman version
          uname -a

      - name: Disk before build
        run: df -h / /mnt 2>&1 || true

      # Build image using buildah and save it to raw-img
      - name: Build Image
        id: build_image
        run: |
          buildah build \
            --build-arg IMAGE_NAME=${{ env.IMAGE_NAME }} \
            --build-arg FEDORA_MAJOR_VERSION=${{ env.FEDORA_MAJOR_VERSION }} \
            --build-arg IMAGE_BRANCH=${{ github.ref_name }} \
            --build-arg IMAGE_BUILDID=${{ steps.generate-version.outputs.tag }} \
            --build-arg PROFILE=${{ steps.profile.outputs.profile }} \
            --tag raw-img .

      - name: Disk after build
        run: df -h / /mnt 2>&1 || true

      # The rpm database verifies clean at the end of final_clean.sh but is
      # corrupt in the published image, so something between the two damages it.
      # This splits that window at the layer commit. Reports without failing,
      # because the database is already known to be bad.
      - name: Check rpm database after layer commit
        shell: bash
        run: |
          if podman run --rm --pull=never \
              --entrypoint /usr/bin/rpmdb localhost/raw-img --verifydb; then
            echo "RPMDB-CHECK: clean after buildah commit"
          else
            echo "RPMDB-CHECK: corrupt after buildah commit"
          fi

          # Allocated smaller than apparent means the zeroed regions are real
          # holes, so the blocks were never written. Equal means something wrote
          # zeros over live data instead.
          podman run --rm --pull=never --entrypoint /usr/bin/stat \
            localhost/raw-img -c 'RPMDB-EXTENT: apparent=%s allocated=%b*%B' \
            /usr/share/rpm/rpmdb.sqlite

          podman run --rm --pull=never --entrypoint /usr/bin/sha256sum \
            localhost/raw-img /usr/share/rpm/rpmdb.sqlite

          podman info --format '{{.Store.GraphDriverName}} {{.Store.GraphRoot}}'

      # Reprocess raw-img using the image's own rpm-ostree, which will delete it
      - name: Run Rechunker
        id: rechunk
        shell: bash
        run: |
          set -euo pipefail

          # /run and /tmp are runtime-only, and content left in them fails
          # bootc container lint.
          buildah unshare bash -euo pipefail -c '
            container=$(buildah from raw-img)
            mnt=$(buildah mount "$container")
            rm -rf "$mnt"/run/.* "$mnt"/run/* "$mnt"/tmp/.* "$mnt"/tmp/* || true
            buildah umount "$container"
            buildah commit --identity-label=false --rm "$container" raw-img
          '

          # No --previous-build. Its packing path keys bins by package name and
          # asserts that every component landed in one, which cannot hold when
          # two components share a name, as multilib .i686 halves do. It aborts
          # the whole chunk. Layer plans are recomputed each build instead, at
          # the cost of larger deltas for existing users.

          KERNEL_VERSION=$(podman run --rm --pull=never \
            --entrypoint /usr/bin/rpm localhost/raw-img \
            -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)

          LABELS=(
            "io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md"
            "org.opencontainers.image.created=${{ steps.date.outputs.date }}"
            "org.opencontainers.image.description=${{ env.IMAGE_DESC }}"
            "org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md"
            "org.opencontainers.image.licenses=Apache-2.0"
            "org.opencontainers.image.revision=${{ github.sha }}"
            "org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile"
            "org.opencontainers.image.title=${{ env.IMAGE_NAME }}"
            "org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}"
            "org.opencontainers.image.vendor=${{ github.repository_owner }}"
            "org.opencontainers.image.version=${{ steps.generate-version.outputs.tag }}"
            "org.universal-blue.pkg.kernel=${KERNEL_VERSION}"
            "org.fedoraproject.coreos.ostree.version=${{ steps.generate-version.outputs.tag }}"
            "ostree.bootable=true"
            "ostree.linux=${KERNEL_VERSION}"
            "io.artifacthub.package.deprecated=false"
            "io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}"
            "io.artifacthub.package.license=Apache-2.0"
            "io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}"
            "io.artifacthub.package.prerelease=false"
            "containers.bootc=1"
          )
          LABEL_ARGS=()
          for label in "${LABELS[@]}"; do
            LABEL_ARGS+=(--label "${label}")
          done

          OUT_DIR="$(mktemp -d "${RUNNER_TEMP}/rechunk-XXXXXX")"
          # final_clean.sh empties /var, so the image has no /var/tmp for
          # rpm-ostree to work in. Disk-backed rather than a tmpfs, since the
          # baseline image is unpacked there.
          TMP_DIR="$(mktemp -d "${RUNNER_TEMP}/rechunk-tmp-XXXXXX")"
          trap 'rm -rf "${OUT_DIR}" "${TMP_DIR}"' EXIT

          # rpm-ostree is run out of the image being chunked so that the
          # libselinux relabelling the tree is the one the image ships. A
          # foreign one silently falls back to the text file_contexts when its
          # PCRE2 is older than the compiled file_contexts.bin.
          podman run --rm --pull=never --privileged \
            --mount=type=image,src=localhost/raw-img,target=/rpm-ostree \
            --volume "${OUT_DIR}:/run/out:Z" \
            --volume "${TMP_DIR}:/var/tmp:Z" \
            --entrypoint /usr/bin/rpm-ostree \
            localhost/raw-img \
            compose build-chunked-oci \
            --bootc --max-layers 127 --format-version 2 \
            "${LABEL_ARGS[@]}" \
            --rootfs /rpm-ostree \
            --output oci-archive:/run/out/chunked.oci

          # Freed before the pull below, which needs room for a second copy.
          podman rmi -f localhost/raw-img

          CHUNKED=$(podman pull oci-archive:"${OUT_DIR}/chunked.oci")
          podman tag "${CHUNKED}" localhost/chunked-img

          echo "ref=containers-storage:localhost/chunked-img" >> $GITHUB_OUTPUT

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          BUILD_TAGS=( "${{ steps.generate-version.outputs.tag }}" )

          # Add other variants
          BUILD_TAGS+=("${FEDORA_MAJOR_VERSION}")
          BUILD_TAGS+=("${{ github.ref_name }}-${{ steps.generate-version.outputs.tag }}")

          # Per fedora version
          BUILD_TAGS+=("${FEDORA_MAJOR_VERSION}-${{ github.ref_name }}")

          BUILD_TAGS+=("latest" "${{ github.ref_name }}")

          echo "Generated the following build tags: "
          for TAG in "${BUILD_TAGS[@]}"; do
              echo "${TAG}"
          done
          echo "alias_tags=${BUILD_TAGS[*]}" >> $GITHUB_OUTPUT

      # Push the image to GHCR (Image Registry)
      - name: Push To GHCR
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        id: push
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        with:
          attempt_limit: 3
          attempt_delay: 15000
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            REF="${{ steps.rechunk.outputs.ref }}"
            for tag in ${{ steps.generate-tags.outputs.alias_tags }}; do
              podman push "${REF#containers-storage:}" docker://${{ env.IMAGE_REGISTRY }}/${{ steps.profile.outputs.image_repo }}:$tag
            done

      - name: Get Image Digest
        id: digest
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: |
          DIGEST=$(skopeo inspect --format '{{.Digest}}' \
            docker://${{ env.IMAGE_REGISTRY }}/${{ steps.profile.outputs.image_repo }}:${{ steps.generate-version.outputs.tag }})
          echo "Digest is: $DIGEST"
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        with:
          cosign-release: 'v2.6.1'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v3
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ steps.profile.outputs.image_repo }}"
          for tag in ${{ steps.generate-tags.outputs.alias_tags }}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY $IMAGE_FULL:$tag
          done
        env:
          TAGS: ${{ steps.digest.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

  generate_release:
    name: Generate Release
    needs: [push-ghcr]
    if: github.event_name != 'pull_request'
    secrets: inherit
    permissions:
      contents: write  # Required for creating releases
    uses: ./.github/workflows/generate-release.yml
    with:
      profile: ${{ needs.push-ghcr.outputs.profile }}
